<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebApp</title>
  <!-- Важно: официальный скрипт Telegram -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
    }
    h1 {
      font-size: 28px;
      font-weight: 500;
      margin: 0;
    }
  </style>
</head>
<body>

  <h1>Привет2</h1>

  <script>
    function sendTimezoneData() {
      try {
        const tg = window.Telegram.WebApp;
        
        // Сигнализируем Telegram, что приложение готово
        tg.ready();

        // Получаем таймзону и смещение
        const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
        const now = new Date();
        const offsetMinutes = now.getTimezoneOffset();
        
        const absOffset = Math.abs(offsetMinutes);
        const hours = String(Math.floor(absOffset / 60)).padStart(2, '0');
        const mins = String(absOffset % 60).padStart(2, '0');
        const sign = offsetMinutes <= 0 ? '+' : '-';
        const utcOffset = `UTC${sign}${hours}:${mins}`;

        const payload = {
          timezone: timezone,
          utc_offset: utcOffset,
          offset_minutes: offsetMinutes,
          user_id: tg.initDataUnsafe?.user?.id || null
        };

        // Отправляем данные боту (закрытие произойдет автоматически)
        tg.sendData(JSON.stringify(payload));
      } catch (e) {
        // Если произошла ошибка, закрываем принудительно
        if (window.Telegram && window.Telegram.WebApp) {
          window.Telegram.WebApp.close();
        }
      }
    }

    // Запускаем отправку после полной загрузки страницы
    if (document.readyState === 'complete') {
      sendTimezoneData();
    } else {
      window.addEventListener('load', sendTimezoneData);
    }
  </script>
</body>
</html>
