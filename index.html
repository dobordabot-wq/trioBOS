<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Таймзона</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #000000);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
    text-align: center;
  }
  p { font-size: 20px; font-weight: 600; }
</style>
<base target="_blank">
</head>
<body>
<p>Ваша зона определена</p>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyXxom_1KZVsPKERBbKsgkTKG1P4-pncZq418sv6zcuyL76p81F2nYHqF4e7x5s5DlP/exec'; // вида https://script.google.com/macros/s/AKfyc.../exec

  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const payload = {
    type: 'timezone',
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    offset_minutes: -new Date().getTimezoneOffset(),
    user_id: tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : null,
    initData: tg.initData || null // для проверки подлинности на стороне Apps Script
  };

  fetch(SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  }).catch(function () {}); // страница ничего не показывает в любом случае
</script>
</body>
</html>
