<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Таймзона</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #000000);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
    text-align: center;
  }
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 24px; }
  p { font-size: 20px; font-weight: 600; margin: 0; }
  button {
    background: var(--tg-theme-button-color, #2481cc);
    color: var(--tg-theme-button-text-color, #ffffff);
    border: none;
    border-radius: 12px;
    padding: 12px 32px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
</style>
<base target="_blank">
</head>
<body>
<div class="wrap">
  <p>Ваша зона определена</p>
  <button id="closeBtn">Закрыть</button>
</div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyXxom_1KZVsPKERBbKsgkTKG1P4-pncZq418sv6zcuyL76p81F2nYHqF4e7x5s5DlP/exec'; // вида https://script.google.com/macros/s/AKfyc.../exec

  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const payload = {
    type: 'timezone',
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    offset_minutes: -new Date().getTimezoneOffset(),
    user_id: tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : null,
    initData: tg.initData || null
  };

  fetch(SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  }).catch(function () {});

  document.getElementById('closeBtn').addEventListener('click', function () {
    tg.close();
  });
</script>
</body>
</html>
